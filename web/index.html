<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LÉA — Physique</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="doodles" aria-hidden="true">
      <span class="dood d1">🚀</span><span class="dood d2">🪐</span>
      <span class="dood d3">🧪</span><span class="dood d4">⚛️</span>
      <span class="dood d5">🛰️</span><span class="dood d6">✨</span>
    </div>
    <main class="app">
      <!-- ============================ ACCUEIL ============================ -->
      <section id="accueil" class="accueil">
        <header class="hud-top">
          <div class="logo">LÉA<svg class="logo-tube" viewBox="0 0 28 28" aria-hidden="true"><g transform="rotate(24 14 14)"><rect x="10.5" y="3" width="7" height="20" rx="3.5" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="1.4"/><path d="M10.5 14 h7 v5.5 a3.5 3.5 0 0 1 -7 0 z" fill="#ffc23c"/><circle class="bub bb1" cx="14" cy="17" r="1.1" fill="#fff"/><circle class="bub bb2" cx="15.2" cy="18" r="0.8" fill="#fff"/><circle class="bub bb3" cx="12.9" cy="18.4" r="0.7" fill="#fff"/></g></svg></div>
          <div class="stats" id="stats"></div>
        </header>

        <div class="hero">
          <div class="hero-holo" id="heroAvatar"></div>
          <div class="hero-txt">
            <span class="eyebrow">Physique · Cycle 4</span>
            <h1 class="hero-h">Prêt·e pour l'expérience&nbsp;?</h1>
            <div class="classe-seg" id="niveauSeg" role="tablist"></div>
            <button id="continuer" class="btn-neon" type="button" hidden></button>
            <button id="ouvrirProfs" class="link" type="button">Changer de prof</button>
          </div>
        </div>

        <div id="profPicker" class="prof-picker" hidden>
          <span class="eyebrow">Choisis ton prof</span>
          <div id="profChips" class="pp-chips"></div>
        </div>

        <div class="sec-head">
          <span class="eyebrow">Missions</span>
          <span class="sec-count" id="modCount"></span>
        </div>
        <div id="modulesGrille" class="missions"></div>

        <p class="note"><a href="dashboard.html">Tableau de bord éducateur →</a></p>
      </section>

      <!-- ============================= LEÇON ============================= -->
      <section id="lecon" class="lecon" hidden>
        <header class="hud">
          <button id="retour" type="button" class="hud-retour" aria-label="Retour au sommaire">←</button>
          <div class="hud-centre">
            <div class="hud-titre" id="hudTitre"></div>
            <div class="hud-barre-fond"><div id="barre" class="hud-barre"></div></div>
          </div>
          <span id="pct" class="hud-pct">0&nbsp;%</span>
          <button id="voix" type="button" class="icone-btn" hidden aria-pressed="false" title="Activer la voix" aria-label="Activer la voix">🔊</button>
        </header>

        <div class="fig-label" id="figLabel">◦ Salle d'expérience — en direct</div>
        <section id="scene" class="scene" aria-hidden="true">
          <div class="tableau">
            <span id="tableauFormule" class="tableau-formule"></span>
            <div id="coursTitre" class="cours-titre" hidden></div>
            <div id="figureHost" class="figure-host" hidden></div>
            <ul id="coursPoints" class="cours-points" hidden></ul>
            <div id="tableauTexte" class="tableau-texte"></div>
          </div>
          <div id="avatarHost" class="avatar-host"></div>
        </section>

        <div id="soustitre" class="soustitre" aria-live="polite"></div>

        <form id="form" class="saisie" autocomplete="off">
          <div id="unites" class="unites" role="group" aria-label="Unité de la réponse" hidden></div>
          <div class="saisie-ligne">
            <div class="champ">
              <input id="reponse" name="reponse" type="text" inputmode="decimal" placeholder="Ta réponse…" aria-label="Ta réponse" />
              <span id="uniteBadge" class="unite-badge" hidden></span>
            </div>
            <button id="micro" type="button" class="micro-btn" hidden title="Répondre à la voix" aria-label="Répondre à la voix">🎤</button>
            <button id="envoyer" type="submit">Envoyer</button>
          </div>
          <div id="pave" class="pave" aria-label="Pavé numérique">
            <button type="button" class="pk pk-util" data-act="clear" aria-label="Tout effacer">C</button>
            <button type="button" class="pk pk-util" data-act="sign" aria-label="Changer de signe">±</button>
            <button type="button" class="pk pk-util" data-act="back" aria-label="Effacer un caractère">⌫</button>
            <button type="button" class="pk" data-k="7">7</button>
            <button type="button" class="pk" data-k="8">8</button>
            <button type="button" class="pk" data-k="9">9</button>
            <button type="button" class="pk" data-k="4">4</button>
            <button type="button" class="pk" data-k="5">5</button>
            <button type="button" class="pk" data-k="6">6</button>
            <button type="button" class="pk" data-k="1">1</button>
            <button type="button" class="pk" data-k="2">2</button>
            <button type="button" class="pk" data-k="3">3</button>
            <button type="button" class="pk pk-comma" data-k=",">,</button>
            <button type="button" class="pk pk-zero" data-k="0">0</button>
          </div>
        </form>

        <nav id="coursNav" class="cours-nav" hidden aria-label="Navigation du cours">
          <button id="coursPrec" type="button" class="cnav-btn">← Précédent</button>
          <div id="coursDots" class="cours-dots" aria-hidden="true"></div>
          <button id="coursSuivant" type="button" class="cnav-btn cnav-suivant">Suivant →</button>
        </nav>

        <div class="actions-sec">
          <button id="perdu" type="button" class="secondaire" title="Demander de l'aide" hidden>Je suis perdu·e</button>
          <button id="revoirCours" type="button" class="secondaire" hidden>Revoir le cours</button>
          <button id="rejouer" type="button" class="rejouer" hidden>Recommencer</button>
        </div>

        <p class="note">Répétition illimitée, sans jugement. La vidéo ne quitte jamais l'appareil.</p>
      </section>
    </main>

    <script src="lea-engine.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
