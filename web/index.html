<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Léa — tuteur de physique</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="deco" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <main class="app">
      <!-- ============================ ACCUEIL ============================ -->
      <section id="accueil" class="accueil">
        <header class="topbar">
          <div class="brand">
            <span class="brand-logo">Léa</span>
            <span class="brand-sub">Physique</span>
          </div>
          <div id="stats" class="stats"></div>
        </header>

        <div class="hero">
          <div class="hero-body">
            <p class="hero-hi" id="heroHi">Salut&nbsp;! 👋</p>
            <h1 class="hero-title">Deviens un·e as de la physique</h1>
            <div class="niveau-select">
              <span class="ns-label">Ta classe</span>
              <div class="ns-seg" id="niveauSeg" role="tablist"></div>
            </div>
            <button id="continuer" class="cta" type="button" hidden></button>
          </div>
          <div class="hero-prof">
            <div id="heroAvatar" class="hero-avatar"></div>
            <button id="ouvrirProfs" class="hero-prof-nom" type="button"></button>
          </div>
        </div>

        <div id="profPicker" class="prof-picker" hidden>
          <span class="pp-label">Choisis ton prof</span>
          <div id="profChips" class="pp-chips"></div>
        </div>

        <div class="section-head">
          <h2>Modules</h2>
          <span id="modCount" class="section-count"></span>
        </div>
        <div id="modulesGrille" class="modules-grille"></div>

        <p class="note accueil-note"><a href="dashboard.html">→ Tableau de bord éducateur</a></p>
      </section>

      <!-- ============================= LEÇON ============================= -->
      <section id="lecon" class="lecon" hidden>
        <header class="hud">
          <button id="retour" type="button" class="hud-retour" aria-label="Retour aux modules">←</button>
          <div class="hud-centre">
            <div class="hud-titre" id="hudTitre"></div>
            <div class="hud-barre-fond"><div id="barre" class="hud-barre"></div></div>
          </div>
          <span id="pct" class="hud-pct">0&nbsp;%</span>
          <button id="voix" type="button" class="icone-btn" hidden aria-pressed="false" title="Activer la voix" aria-label="Activer la voix">🔊</button>
        </header>

        <!-- Le prof écrit la CONSIGNE au tableau et la LIT ; sa parole s'affiche
             en SOUS-TITRES. Signaux synthétiques, jamais de caméra (§1.4). -->
        <section id="scene" class="scene" aria-hidden="true">
          <div class="tableau">
            <span id="tableauFormule" class="tableau-formule"></span>
            <div id="tableauTexte" class="tableau-texte"></div>
          </div>
          <div id="avatarHost" class="avatar-host"></div>
        </section>

        <div id="soustitre" class="soustitre" aria-live="polite"></div>

        <form id="form" class="saisie" autocomplete="off">
          <input id="reponse" name="reponse" type="text" inputmode="text" placeholder="Ta réponse…" aria-label="Ta réponse" />
          <button id="micro" type="button" class="micro-btn" hidden title="Répondre à la voix" aria-label="Répondre à la voix">🎤</button>
          <button id="envoyer" type="submit">Envoyer</button>
        </form>

        <div class="actions-sec">
          <button id="perdu" type="button" class="secondaire" title="Demander de l'aide">Je suis perdu·e</button>
          <button id="rejouer" type="button" class="rejouer" hidden>Recommencer</button>
        </div>

        <p class="note">Répétition illimitée, sans jugement. La vidéo ne quitte jamais l'appareil.</p>
      </section>
    </main>

    <script src="lea-engine.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
