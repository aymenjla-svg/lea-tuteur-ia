<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Léa — tuteur</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="entete">
        <h1>Léa</h1>
        <label class="palier">
          présence
          <select id="palier" aria-label="Palier de présence">
            <option value="2d_svg">avatar (SVG)</option>
            <option value="texte">texte seul</option>
          </select>
        </label>
      </header>

      <!-- Avatar — palier 2D/SVG expressif (R6, ADDENDUM v1/A1). Rig maison :
           couches (base, joues, yeux, sourcils, bouche) pilotées par l'ÉTAT
           déterministe. Signaux synthétiques, jamais de caméra (§1.4). -->
      <section id="scene" class="scene" aria-hidden="true">
        <svg viewBox="0 0 100 100" class="visage" role="img">
          <g id="visageG">
            <circle cx="50" cy="50" r="46" fill="#ffe0bd" />
            <!-- Joues (blush) — révélées sur happy/celebrate. -->
            <circle id="joueG" cx="29" cy="58" r="7" fill="#ff8fa3" opacity="0" />
            <circle id="joueD" cx="71" cy="58" r="7" fill="#ff8fa3" opacity="0" />
            <g id="oeilG">
              <circle cx="36" cy="42" r="7" fill="#fff" />
              <circle id="pupilleG" cx="36" cy="42" r="3.2" fill="#3a3a3a" />
            </g>
            <g id="oeilD">
              <circle cx="64" cy="42" r="7" fill="#fff" />
              <circle id="pupilleD" cx="64" cy="42" r="3.2" fill="#3a3a3a" />
            </g>
            <path id="sourcilG" d="M28 34 Q36 30 44 34" stroke="#9a6b4f" stroke-width="1.8" fill="none" stroke-linecap="round" />
            <path id="sourcilD" d="M56 34 Q64 30 72 34" stroke="#9a6b4f" stroke-width="1.8" fill="none" stroke-linecap="round" />
            <!-- Bouche : ellipse (parole/lip-sync) + sourire (expression, hors parole). -->
            <path id="sourire" d="M40 66 Q50 73 60 66" stroke="#a33" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0" />
            <ellipse id="bouche" cx="50" cy="68" rx="11" ry="3" fill="#a33" />
          </g>
        </svg>
      </section>

      <!-- L'écrit est toujours présent (P1 : écrit de plein droit). -->
      <section class="parole" aria-live="polite">
        <p id="parole">…</p>
        <span id="coup" class="coup"></span>
      </section>

      <section class="progres">
        <div class="barre-fond"><div id="barre" class="barre"></div></div>
        <span id="pct" class="pct">0&nbsp;%</span>
      </section>

      <ol id="transcript" class="transcript" aria-label="Conversation"></ol>

      <form id="form" class="saisie" autocomplete="off">
        <input
          id="reponse"
          name="reponse"
          type="text"
          inputmode="text"
          placeholder="Ta réponse…"
          aria-label="Ta réponse"
        />
        <button id="envoyer" type="submit">Envoyer</button>
        <button id="perdu" type="button" class="secondaire" title="Demander de l'aide">
          Je suis perdu·e
        </button>
      </form>

      <button id="rejouer" class="rejouer" hidden>Nouvelle séance</button>

      <p class="note">
        Répétition illimitée, sans jugement. La vidéo ne quitte jamais l'appareil.
      </p>
      <p class="note"><a href="dashboard.html">→ Tableau de bord éducateur</a></p>
    </main>

    <!-- Moteur déterministe embarqué (visu statique) — définit window.LeaEngine
         avant app.js. Absent d'un déploiement backend : app.js bascule alors
         automatiquement sur l'API HTTP. -->
    <script src="lea-engine.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
